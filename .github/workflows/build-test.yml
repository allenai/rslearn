name: Build and Test rslearn

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest-m
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup disk space
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Build Docker image
        run: docker build -t rslearn-test .

      - name: Run Unit and Integration Tests
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          docker run --rm \
            -v "$RUNNER_TEMP/coverage:/coverage" \
            -e CI="true" \
            rslearn-test \
            pytest -n auto tests/unit/ tests/integration/ -vv \
            --ignore tests/unit/models/test_molmo.py \
            --ignore tests/unit/models/test_clay.py \
            --cov --cov-report=xml:/coverage/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/coverage/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Clean up
        if: always()
        run: docker image prune -f
